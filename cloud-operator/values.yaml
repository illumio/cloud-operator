defaultNamespace: "illumio-cloud"
priorityClassName: ""
image:
  repository: "ghcr.io/illumio/cloud-operator"
  tag: "0.0.1"
  pullPolicy: IfNotPresent

# Optional labels added to every resource.
# For example:
#
#   additionalLabels:
#     key1: value1
#     key2: value2
additionalLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: true
  name: "illumio-cloud-sa"
  annotations: {}
  automount: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

clusterCredsSecret:
  clientId: ""
  clientSecret: ""
  disableSecretCreation: false
  forceSecretCreation: false

onboardingSecret:
  clientId: ""
  clientSecret: ""

service:
  clusterIP: ""

# Optional cluster metadata for self-managed clusters.
# For managed clusters (EKS, AKS, GKE, OCI), these are auto-detected from node labels and/or the cloud APIs.
# For self-managed clusters, set these values to identify the cluster in CloudSecure.
cluster:
  # The name of the cluster as it should appear in CloudSecure.
  # If empty, defaults to the name of the cluster returned by the cloud provider's API, if configured.
  name: ""

cilium:
  # The namespaces in which Cilium may be deployed.
  # cloud-operator will search for the Hubble Relay service in each namespace,
  # in this order: kube-system for Cilium installed with its Helm chart,
  # gke-managed-dpv2-observability for GKE Dataplane V2, and cilium for Cilium
  # installed with its OLM operator on OpenShift.
  namespaces:
    - kube-system
    - gke-managed-dpv2-observability
    - cilium

calico:
  # TLS for the Calico Enterprise syslog collector. Optional: without a
  # certificate, the collector accepts plain-text syslog only.
  #
  # The collector serves the certificate in the Secret named
  # cloud-operator-syslog-tls in the operator's namespace, if that Secret
  # exists. With a certificate, the collector accepts both TLS and plain-text
  # connections; set required to true to accept TLS only.
  #
  # On OpenShift, OpenShift's service-ca creates and renews this Secret
  # automatically. The LogCollector must trust OpenShift's service CA: copy it
  # from the openshift-service-ca.crt ConfigMap (key service-ca.crt) to the
  # syslog-ca ConfigMap in the tigera-operator namespace (key tls.crt), and copy
  # it again when OpenShift renews its service CA.
  #
  # Elsewhere, create the Secret yourself, of type kubernetes.io/tls.
  #
  # Certificate requirements:
  # - Subject Alternative Names: the DNS names of the operator Service,
  #   <service>.<namespace>.svc and <service>.<namespace>.svc.cluster.local,
  #   for example illumio-cloud-operator.illumio-cloud.svc for release illumio
  #   in namespace illumio-cloud. The common name (CN) is not used.
  # - Extended key usage: server authentication.
  # - Issuer: a CA that the LogCollector trusts. Add the CA certificate to the
  #   syslog-ca ConfigMap in the tigera-operator namespace, under the tls.crt
  #   key. Public CAs do not issue certificates for .svc names.
  #
  # The Secret holds the PEM-encoded certificate, followed by any intermediate
  # CA certificates, under tls.crt, and the PEM-encoded private key under
  # tls.key:
  #
  #   apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: cloud-operator-syslog-tls
  #     namespace: illumio-cloud
  #   type: kubernetes.io/tls
  #   data:
  #     tls.crt: <base64-encoded certificate chain>
  #     tls.key: <base64-encoded private key>
  #
  # Or create it from the certificate and key files:
  #
  #   kubectl create secret tls cloud-operator-syslog-tls -n illumio-cloud --cert=tls.crt --key=tls.key
  #
  # The collector reads the certificate on each new connection, so a created or
  # renewed Secret is used without restarting the operator. Outside OpenShift,
  # renew the certificate in the Secret before it expires.
  syslogTLS:
    required: false

openshift:
  # The namespace in which OVN-k is deployed.
  # cloud-operator uses this to determine whether OVN-k is deployed, in which
  # case the IPFIX collector on UDP port 4739 is enabled.
  ovnkNamespace: "openshift-ovn-kubernetes"

  # The list of IP address CIDRs of the cluster's worker nodes.
  # Used to restrict access from only those nodes to the IPFIX collector on UDP
  # port 4739 in the NetworkPolicy.
  #
  # For example:
  # workerNodeCidrs:
  #   - "10.1.0.0/24"
  #   - "10.2.0.0/24"
  #
  # If empty, defaults to allowing ingress traffic to UDP port 4739 from any
  # address. This is a safe default only on clusters that are not running
  # OpenShift with OVN-k, because port 4739 is not open in that case.
  workerNodeCidrs: []

  # The cloud-operator container runs as a fixed non-root UID (65532), which is
  # outside the UID range allowed by OpenShift's default "restricted" SCC, so
  # the pod is rejected on OpenShift unless its service account is granted the
  # "anyuid" SCC. When true (the default), the chart creates a RoleBinding to
  # the "system:openshift:scc:anyuid" ClusterRole so this works automatically.
  # The RoleBinding is only rendered when the SCC API is present (i.e. on
  # OpenShift), so leaving this enabled is safe on non-OpenShift clusters.
  # Set to false to manage the SCC assignment yourself (e.g. via
  # `oc adm policy add-scc-to-user anyuid -z <sa> -n <namespace>`).
  createAnyuidSccRoleBinding: true

awsVpcCni:
  # EKS Auto Mode Network Policy Agent log collection.
  #
  # On EKS Auto Mode the VPC CNI and its Network Policy Agent are AWS-managed and
  # are NOT exposed as pods, so the standard aws-node pod-log collector cannot see
  # them. The operator reads each Auto Mode node's node-local agent log
  # (aws-routed-eni/network-policy-agent.log) through the kubelet node-proxy
  # endpoint (GET /api/v1/nodes/{node}/proxy/logs/...) by polling on an interval.
  #
  # It uses only the operator service account and Kubernetes RBAC (a read-only
  # get on the kubelet log endpoint). The collector activates automatically only
  # on clusters with EKS Auto Mode nodes (node label
  # eks.amazonaws.com/compute-type=auto); on all other clusters it is disabled.
  autoModeNodeProxyLogCollection:
    # Interval between polls of each node's agent log.
    pollInterval: "10s"
    # Maximum number of nodes polled concurrently, to bound load on apiserver.
    maxConcurrentNodePolls: 10
    # Also grant the broad `nodes/proxy` RBAC permission for the node-proxy log
    # read, in addition to the always-granted fine-grained `nodes/log`.
    #
    # `nodes/proxy` is very broad - it also authorizes exec/attach/portforward
    # (remote code execution on nodes). Fine-grained kubelet authorization
    # (KubeletFineGrainedAuthz; beta/on-by-default in k8s 1.33, GA in 1.36) maps
    # the /logs/ path to the narrow `nodes/log` subresource, which is all the
    # operator needs. On k8s <1.33 that subresource is unavailable, so
    # `nodes/proxy` is required to reach the log endpoint.
    #
    # Defaults to true for backward compatibility with k8s <1.33. Set to false on
    # clusters running k8s >=1.33 to drop the broad permission and rely solely on
    # `nodes/log`.
    grantNodesProxy: true
    # Node-local path (relative to the kubelet log root) of the Network Policy
    # Agent log. This is the active log file AND the filename prefix used to
    # discover its rotated generations (e.g. network-policy-agent-<timestamp>.log.gz),
    # not the only filename queried. Overridable in case a future AWS agent
    # version relocates the file.
    logPath: "aws-routed-eni/network-policy-agent.log"

env:
  # Flow cache settings for network flow aggregation before sending to CloudSecure.
  flowCache:
    # Duration a flow stays in cache before being evicted and sent.
    activeTimeout: "20s"
    # Buffer size for the outbound flow channel.
    channelBufferSize: 100
    # Maximum number of flows to hold in cache.
    maxSize: 1000

  # If true, enables GRPC internal logging (connection states, TLS handshakes, transport events).
  # These logs appear at DEBUG level, so they only show when log level is DEBUG.
  grpcInternalLogging: false

  # The URL of the HTTPS proxy to be used by cloud-operator to connect to
  # Illumio CloudSecure. If not set, no proxy will be used.
  httpsProxy: ""

  # The UDP port on which cloud-operator is receiving IPFIX messages.
  # Currently, only OVS/OVN-k flow templates are supported, and cloud-operator
  # only listens on this port if it detects at startup that OVN-k is installed.
  # UDP 4739 is the standard port for IPFIX over UDP and should not be changed.
  ipfixCollectorPort: 4739

  # The TCP port on which cloud-operator receives syslog flow logs from Calico
  # Enterprise's LogCollector. cloud-operator only listens on this port if it
  # detects at startup that Calico Enterprise is installed. The collector
  # accepts plain-text syslog, and TLS when the cloud-operator-syslog-tls
  # Secret exists (see calico.syslogTLS).
  syslogCollectorPort: 6514

  # The API URL used by cloud-operator to onboard itself if onboardingSecret
  # is set and clusterCredsSecret is not set.
  # This variable may only be modified for testing.
  onboardingEndpoint: "https://cloud.illum.io/api/v1/k8s_cluster/onboard"

  # The interval between log entries with statistics about
  # the flows and resource mutations that were sent to the server.
  statsLogPeriod: "30m"

  # The intervals between keepalive messages sent over each stream.
  # After a detected collector starts, flow liveness allows 3x the shortest
  # period + the collector's polling interval (if any) + flowCache.activeTimeout
  # + 1m without a successfully sent data flow.
  streamKeepalivePeriods:
    configuration: "10s"
    kubernetesResources: "10s"
    kubernetesNetworkFlows: "10s"
    logs: "10s"

  # The duration that a stream be in a connected state for it to be considered
  # successfully connected.
  streamSuccessPeriods:
    auth: "2h"
    connect: "1h"

  # If true, disables the verification of TLS certificates of API endpoints.
  # This variable may only be modified for testing.
  tlsSkipVerify: false

  # The API URL used by cloud-operator to authenticate itself after it has been
  # onboarded.
  # This variable may only be modified for testing.
  tokenEndpoint: "https://cloud.illum.io/api/v1/k8s_cluster/authenticate"

  # If true, enables verbose debugging.
  verboseDebugging: false
