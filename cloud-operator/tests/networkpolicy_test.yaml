suite: test network policy
templates:
  - networkpolicy.yaml
tests:
  - it: should allow syslog flow logs only from the LogCollector pods of all Calico Enterprise versions
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
              - protocol: TCP
                port: 6514
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: tigera-fluentd
                podSelector:
                  matchExpressions:
                    - key: k8s-app
                      operator: In
                      values:
                        - fluentd-node
                        - fluentd-node-windows
                        - calico-fluent-bit
                        - calico-fluent-bit-windows
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: calico-system
                podSelector:
                  matchExpressions:
                    - key: k8s-app
                      operator: In
                      values:
                        - fluentd-node
                        - fluentd-node-windows
                        - calico-fluent-bit
                        - calico-fluent-bit-windows

  - it: should use the configured LogCollector namespaces and pod labels
    set:
      calico.logCollectorNamespaces:
        - custom-logs
      calico.logCollectorPodLabels:
        - custom-forwarder
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: custom-logs
              podSelector:
                matchExpressions:
                  - key: k8s-app
                    operator: In
                    values:
                      - custom-forwarder

  - it: should allow every pod in the LogCollector namespaces when no pod labels are set
    set:
      calico.logCollectorPodLabels: []
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: tigera-fluentd
              podSelector: {}
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: calico-system
              podSelector: {}
