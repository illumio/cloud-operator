suite: test cloud-operator service
templates:
  - cloud-operator-service.yaml
tests:
  - it: should ask OpenShift's service-ca for a syslog TLS certificate on OpenShift
    capabilities:
      apiVersions:
        - security.openshift.io/v1
    asserts:
      - equal:
          path: metadata.annotations["service.beta.openshift.io/serving-cert-secret-name"]
          value: RELEASE-NAME-cloud-operator-syslog-tls

  - it: should not annotate the Service outside OpenShift
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should not annotate the Service when a syslog TLS Secret is configured
    capabilities:
      apiVersions:
        - security.openshift.io/v1
    set:
      calico.syslogTLS.secretName: "syslog-tls-cert"
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should not annotate the Service when service-ca is disabled
    capabilities:
      apiVersions:
        - security.openshift.io/v1
    set:
      calico.syslogTLS.openshiftServiceCA: false
    asserts:
      - notExists:
          path: metadata.annotations
