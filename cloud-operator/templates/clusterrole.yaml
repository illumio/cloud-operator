apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloud-operator.fullname" . }}
  labels:
    {{- include "cloud-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps", "endpoints", "namespaces", "nodes", "pods", "replicationcontrollers", "serviceaccounts", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies", "ingresses", "ingressclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumcidrgroups", "ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# AWS VPC CNI - operator creates a ClusterNetworkPolicy for flow logging and
# ingests/reconciles ClusterNetworkPolicy resources for policy support.
# NOTE: delete only applies to policies from CloudSecure.
- apiGroups: ["networking.k8s.aws"]
  resources: ["clusternetworkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# ApplicationNetworkPolicy is ingest-only (streamed to CloudSecure for visibility);
# it is never enforced/reconciled, so read-only verbs suffice.
- apiGroups: ["networking.k8s.aws"]
  resources: ["applicationnetworkpolicies"]
  verbs: ["get", "list", "watch"]
# EKS Auto Mode - operator reads the AWS-managed Network Policy Agent log via the
# kubelet node-proxy endpoint (GET /api/v1/nodes/{node}/proxy/logs/...). This grants
# only the minimal read-only nodes/proxy get permission. The collector activates
# only when Auto Mode is detected (compute-type=auto node label), so on non-Auto-Mode
# clusters this permission is present but unused.
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "gatewayclasses", "httproutes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["config.openshift.io"]
  resources: ["ingresses", "nodes"]
  verbs: ["get", "list", "watch"]
