apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-operator.labels" . | nindent 4 }}
  {{- if include "cloud-operator.syslogTLSFromOpenShiftServiceCA" . }}
  annotations:
    # OpenShift's service-ca creates and renews a TLS certificate for this
    # Service in this Secret; the syslog collector serves it.
    service.beta.openshift.io/serving-cert-secret-name: {{ include "cloud-operator.syslogTLSSecretName" . }}
  {{- end }}
spec:
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  selector:
    app: {{ include "cloud-operator.name" . }}
    release: {{ .Release.Name }}
  ports:
    - name: ipfix-collector
      protocol: UDP
      port: {{ .Values.env.ipfixCollectorPort }}
      targetPort: {{ .Values.env.ipfixCollectorPort }}
    - name: syslog-collector
      protocol: TCP
      port: {{ .Values.env.syslogCollectorPort }}
      targetPort: {{ .Values.env.syslogCollectorPort }}