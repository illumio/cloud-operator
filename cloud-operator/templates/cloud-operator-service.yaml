apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-operator.labels" . | nindent 4 }}
  annotations:
    # On OpenShift, service-ca creates and renews a TLS certificate for this
    # Service in this Secret, which the syslog collector serves. Ignored
    # elsewhere.
    service.beta.openshift.io/serving-cert-secret-name: cloud-operator-syslog-tls
spec:
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  selector:
    app: {{ include "cloud-operator.name" . }}
    release: {{ .Release.Name }}
  ports:
    - name: ipfix-collector
      protocol: UDP
      port: {{ .Values.env.ipfixCollectorPort }}
      targetPort: {{ .Values.env.ipfixCollectorPort }}
    - name: syslog-collector
      protocol: TCP
      port: {{ .Values.env.syslogCollectorPort }}
      targetPort: {{ .Values.env.syslogCollectorPort }}