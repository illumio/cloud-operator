{{- /*
cloud-operator creates the clustercreds Secret when it onboards, and stores the
cluster's credentials in it. This template renders the Secret only for
credentials given in clusterCredsSecret, or if forceSecretCreation is set.

It must not render a Secret with empty credentials by default: "lookup" finds no
Secret under "helm template" and GitOps tools, so every deployment would apply
that Secret again, erase the credentials, and onboard the cluster again as a new
cluster.
*/ -}}
{{- $hasCredentials := or .Values.clusterCredsSecret.clientId .Values.clusterCredsSecret.clientSecret }}
{{- /* "and" and "or" stop at the first operand that decides the result, so "lookup" runs only if it is needed. */ -}}
{{- if and (not .Values.clusterCredsSecret.disableSecretCreation) (or .Values.clusterCredsSecret.forceSecretCreation (and $hasCredentials (not (lookup "v1" "Secret" .Release.Namespace "clustercreds")))) }}
apiVersion: v1
kind: Secret
metadata:
  name: clustercreds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  client_id: "{{ .Values.clusterCredsSecret.clientId | b64enc }}"
  client_secret: "{{ .Values.clusterCredsSecret.clientSecret | b64enc }}"
{{- end -}}
