apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-network-flow-export
  namespace: {{ .Values.defaultNamespace }}
  labels:
    {{- include "cloud-operator.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow IPFIX-over-UDP packets from the ovs-vswitchd daemon
    # that runs on every worker node in OpenShift OVN-k clusters.
    - ports:
        - protocol: UDP
          port: {{ .Values.env.ipfixCollectorPort }}
      {{- if .Values.openshift.workerNodeCidrs }}
      from:
        {{- range .Values.openshift.workerNodeCidrs }}
        - ipBlock:
            cidr: "{{.}}"
        {{- end }}
      {{- end }}
    # Allow syslog flow logs from Calico Enterprise's LogCollector pods:
    # Fluentd in tigera-fluentd (older releases) and Fluent Bit in
    # calico-system (newer releases).
    - ports:
        - protocol: TCP
          port: {{ .Values.env.syslogCollectorPort }}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tigera-fluentd
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - fluentd-node
                  - fluentd-node-windows
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: calico-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - calico-fluent-bit
                  - calico-fluent-bit-windows
